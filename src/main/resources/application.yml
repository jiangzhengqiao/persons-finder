# ===================================================================
# 1. Server Configuration
# ===================================================================
server:
  port: 8080
  error:
    include-message: always
  tomcat:
    threads:
      max: 100
    accept-count: 200
    max-connections: 10000

# ===================================================================
# 2. Spring Core & Persistence
# ===================================================================
spring:
  application:
    name: person-finder-ai

  # Database & Connection Pool
  datasource:
    url: jdbc:postgresql://localhost:5432/persons
    username: jiangzq
    password: ""
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 100
      minimum-idle: 20
      idle-timeout: 600000
      connection-timeout: 5000
      max-lifetime: 1800000
      register-mbeans: true

  # JPA & Hibernate (Spatial Support)
  jpa:
    open-in-view: false
    show-sql: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisDialect
        jdbc:
          batch_size: 50
          lob:
            non_contextual_creation: true
        order_updates: true

  # Redis & Lettuce Pool
  redis:
    host: localhost
    port: 6379
    timeout: 200ms
    lettuce:
      shutdown-timeout: 100ms
      pool:
        enabled: true
        max-active: 50
        max-idle: 20
        min-idle: 5

# ===================================================================
# 3. Custom Business Logic
# ===================================================================
app:
  seed-data: true
  geo:
    redis-search-limit: 500
  ai:
    mock: false
    api-url: ${APP_AI_API_URL:https://api.openai.com/v1/chat/completions}
    api-key: ${APP_AI_API_KEY:security}
    model: gpt-4o-mini

# ===================================================================
# 4. Third-party Tools
# ===================================================================
rest-template:
  connect-timeout: 5000
  read-timeout: 15000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

# ===================================================================
# 5. Logging & Metrics
# ===================================================================
logging:
  level:
    root: INFO
    com.persons.finder: INFO
    org.hibernate.SQL: INFO
    org.springframework.web: INFO
    com.zaxxer.hikari: INFO